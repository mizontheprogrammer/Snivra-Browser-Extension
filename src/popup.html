<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snivra</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <span class="brand-icon" aria-hidden="true">S</span>
      <div><strong>Snivra</strong><span>Screenshot to text</span></div>
    </header>
    <main>
      <section id="picker">
        <button id="paste-image" class="primary paste-button">Paste screenshot</button>
        <p class="paste-help">Copy a screenshot, then click the button or press <kbd>Ctrl</kbd> + <kbd>V</kbd>.</p>
        <div class="divider"><span>or</span></div>
        <label class="drop-zone" id="drop-zone" for="image-file">
          <span class="upload-icon">↑</span>
          <strong>Choose a screenshot file</strong>
          <span>or drag and drop it here</span>
          <small>PNG, JPEG, or WebP · maximum 25 MB</small>
        </label>
      </section>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <section id="workspace" hidden>
        <div class="preview-row">
          <img id="preview" alt="Selected screenshot">
          <div><strong id="file-name"></strong><span id="confidence"></span></div>
          <button id="new-image" class="text-button">Change</button>
        </div>
        <div class="status-row"><span id="message" role="status">Preparing OCR…</span><progress id="progress" max="100" value="0"></progress></div>
        <label class="result-label" for="result">Recognized text</label>
        <textarea id="result" spellcheck="true" placeholder="Recognized text will appear here"></textarea>
        <div class="actions">
          <button id="copy" class="primary" disabled>Copy text</button>
          <button id="download" disabled>Download .txt</button>
        </div>
      </section>
    </main>
    <footer>Pasted and opened screenshots are processed locally and never uploaded.</footer>
    <script src="vendor/tesseract.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
